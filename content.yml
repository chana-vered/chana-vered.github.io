# ─── About ───────────────────────────────────────────────────────────
about:
  eyebrow: >-
    About

  heading: >-
    A teacher who begins with the woman in front of her.

  paragraph_1: >-
    Chana Vered does not teach the inner Torah as a subject. She teaches it as
    something to be inhabited — and that begins where life actually happens: in
    the body, in the breath, in the ordinary weeks that ask more of us than we
    thought we had.

  paragraph_2: >-
    Her classes are embodied Torah learning: text alongside somatic movement,
    meditation and deep listening, so that an idea is not only understood but
    felt. Wisdom that stays in the head changes very little; wisdom that
    reaches the body changes the week.

  paragraph_3: >-
    She teaches internationally, mentors privately, and speaks to communities,
    schools and organizations. Each Rosh Chodesh she gathers women in a circle —
    learning the year through the Hebrew months, in alignment with the moon.

  # One phrase from each paragraph, copied exactly as it appears above. It blooms
  # large behind the paragraph as that part is read. Keep all three lines, even
  # if you change the words.
  paragraph_1_highlight: >-
    in the ordinary weeks that ask more of us than we thought we had
  paragraph_2_highlight: >-
    not only understood but felt
  paragraph_3_highlight: >-
    in alignment with the moon

  # The quote in the coloured box.
  quote: >-
    The wisdom was never meant to stay on the page. It was meant to change the
    way you move through your month.


# ─── Teaching — the four cards ───────────────────────────────────────
teaching:
  eyebrow: >-
    Embodied Torah learning

  heading: >-
    Four ways to learn together

  intro: >-
    Every format shares the same spine: real text, real inner work, and a body
    that learns alongside the mind — built to expand consciousness, not fill a
    notebook.

  # To add another card, copy one whole block starting at "- title:".
  cards:
    - title: >-
        Inner Torah Classes
      text: >-
        Weekly learning in the mystical dimension of Torah — Chassidut,
        Kabbalah and parsha, taught for daily life.

    - title: >-
        Movement & Meditation
      text: >-
        Somatic practice, breath and guided Jewish meditation — quieting the
        noise until you can hear yourself again.

    - title: >-
        Private Mentorship
      text: >-
        One-to-one mentoring through a threshold season — deep listening, full
        presence, inner alignment and clarity.

    - title: >-
        Circles & Retreats
      text: >-
        Women gathering at each new moon for the Hebrew month, and longer
        retreats for heart-centered integration.


