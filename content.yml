# ─── About ───────────────────────────────────────────────────────────
about:
  eyebrow: >-
    About

  heading: >-
    A teacher who listens deeply to the person before her.

  paragraph_1: >-
    Chana Vered does not teach the inner Torah as a subject. She teaches it as
    something to be inhabited - that begins where life actually happens: in
    the body, in the breath, in the ordinary weeks that ask more of us than we
    thought we had.

  paragraph_2: >-
    Her classes combine text study, meditation and energy work: ensuring that wisdom is not just understood, but also received directly into the vessel as actionable tools. Wisdom that stays in the mind changes very little; wisdom that
    setlles into our daily life transforms everything. 

  paragraph_3: >-
    She teaches internationally, mentors privately, and speaks to communities,
    schools and organizations. Each Rosh Chodesh she gathers women in a circle —
    learning the year through the Hebrew months, in alignment with the flow of creation.

  # One phrase from each paragraph, copied exactly as it appears above. It blooms
  # large behind the paragraph as that part is read. Keep all three lines, even
  # if you change the words.
  paragraph_1_highlight: >-
    in the ordinary weeks that ask more of us than we thought we had
  paragraph_2_highlight: >-
    not only understood but felt
  paragraph_3_highlight: >-
    in alignment with the flow of creation

  # The quote in the coloured box.
  quote: >-
    The wisdom was never meant to stay on the page. It was meant to change the
    way you move through your month.


# ─── Teaching — the four cards ───────────────────────────────────────
teaching:
  eyebrow: >-
    Lived Torah learning

  heading: >-
    Four ways to learn together

  intro: >-
    Every format shares the same spine: real text, real inner work, and a body
    that learns alongside the mind — built to expand consciousness, not fill a
    notebook.

  # To add another card, copy one whole block starting at "- title:".
  cards:
    - title: >-
        Rosh Chodesh Circles & Retreats
      text: >-
        Monthly women's gatherings in circle consciousness  - aligning with calendar rhythms, Kabbalah of the Feminine, and seasonal renewal. As well as longer
        retreats for heart-centered integration.

    - title: >-
        Online Classes & Workshops
      text: >-
        Immersive learning bridging Chassidut, Kabbalah, meditation and energy work - offering practical tools to integrate new light into your vessel. 

    - title: >-
        Speaking & Facilitation
      text: >-
        Transformative keynotes and interactive workshops for communities and organisations - weaving psycho-spiritual Torah, meditation and movement.

    - title: >-
        Living Torah Community
      text: >-
        A vibrant digital space receiving weekly guidnce, practical spiritual tools and ongoing inspiration for daily healing, growth and transformation.


