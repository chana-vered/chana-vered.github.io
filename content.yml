# ─── About ───────────────────────────────────────────────────────────
about:
  eyebrow: >-
    About

  heading: >-
    A teacher who begins with the human being in front of her.

  paragraph_1: >-
    Chana Vered is a passionate Torah educator, spiritual mentor and
    inspirational speaker. Her teaching starts where life actually happens —
    in anxiety, in transition, in the ordinary weeks that ask more of us than
    we thought we had.

  paragraph_2: >-
    Drawing on decades of Jewish thought alongside meditation, mental health
    awareness and energy healing, she translates ideas that can feel abstract
    into something you can use before the day is over. Her classes are warm,
    unhurried and honest, and they leave people with tools rather than
    inspiration alone.

  paragraph_3: >-
    She teaches internationally, mentors privately, and speaks to communities,
    schools and organizations looking for depth without heaviness.

  # The quote in the coloured box.
  quote: >-
    The wisdom was never meant to stay on the page. It was meant to change the
    way you walk through your week.


# ─── Teaching — the four cards ───────────────────────────────────────
teaching:
  eyebrow: >-
    What Chana Vered offers

  heading: >-
    Four ways to learn together

  intro: >-
    Every format shares the same spine: real text, real inner work, and
    something practical to carry home.

  # To add another card, copy one whole block starting at "- title:".
  cards:
    - title: >-
        Torah Classes
      text: >-
        Weekly text-based learning — Chassidut, parsha and Jewish thought —
        taught for depth and for daily life.

    - title: >-
        Meditation & Inner Work
      text: >-
        Guided Jewish meditation and breath practice for quieting the noise and
        hearing yourself again.

    - title: >-
        Private Mentorship
      text: >-
        One-to-one spiritual mentoring and energy healing for people navigating
        a threshold season.

    - title: >-
        Retreats & Workshops
      text: >-
        Immersive days and weekends built around a single question worth
        sitting with.


