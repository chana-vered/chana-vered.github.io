# ─────────────────────────────────────────────────────────────────────
#  ALL THE WORDS ON THE WEBSITE
#
#  Change the text, then press the green "Commit changes" button.
#  The website updates itself about a minute later.
#
#  Two rules:
#    1. Leave the label and the  >-  alone. Only change the words
#       on the indented lines underneath them.
#    2. Keep those words indented (a few spaces in from the left).
#
#  You can write a long paragraph across several lines — they get
#  joined together into one paragraph on the website.
#
#  Lines starting with # are notes to you. They never appear online.
# ─────────────────────────────────────────────────────────────────────


